name: 小乐园自动更新
on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 选择要做的事
        type: choice
        options:
          - 更新主页
          - 喂小呱
          - 明天休息
          - 明天出发
        default: 更新主页
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: playground-writer
  cancel-in-progress: false
jobs:
  update:
    name: 更新中文主页与小呱
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       contains(fromJSON('["更新主页","喂小呱","明天休息","明天出发"]'), github.event.issue.title))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 取出主页文件
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - name: 准备运行环境
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装页面解析工具
        run: python -m pip install -r requirements.txt
      - name: 检查游戏、照顾小呱、准备盲盒
        id: daily
        env:
          PLAY_ACTION: ${{ github.event.issue.title || inputs.action || '更新主页' }}
        run: python scripts/update.py
      - name: 生成真实贡献贪吃蛇
        id: snake
        if: steps.daily.outputs.snake == 'true'
        continue-on-error: true
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 把动画放到主页
        if: steps.snake.outcome == 'success'
        run: python scripts/update.py --render-only --snake-complete
      - name: 保存本次变化
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/state.json assets postcards 旅行相册.md
          if ! git diff --cached --quiet; then
            git commit -m '更新小乐园：游戏、旅行与每日盲盒'
            git push
          fi
      - name: 关闭已完成的操作记录
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER"
